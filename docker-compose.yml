version: "3.8"

# =============================================================
# Bitcoin Volatility ML - Docker Compose
# Fase 2: +Spark Master/Worker, MLflow, Hive Metastore, Trino, Grafana
# =============================================================

x-prefect-common: &prefect-common
  build:
    context: ./prefect
    dockerfile: Dockerfile
  environment: &prefect-common-env
    PREFECT_API_URL: http://prefect-server:4200/api
    # MinIO / S3
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    # PostgreSQL via PgBouncer (untuk flow writes)
    PGBOUNCER_HOST: pgbouncer
    PGBOUNCER_PORT: "6432"
    APP_DB_HOST: postgres
    APP_DB_PORT: 5432
    APP_DB_NAME: ${POSTGRES_DB_APP}
    APP_DB_USER: ${POSTGRES_USER}
    APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    # MLflow
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    # Twitter
    TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN}
    TWITTER_SCRAPE_LIMIT: ${TWITTER_SCRAPE_LIMIT:-200}
    # Telegram
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
  volumes:
    - ./prefect/flows:/opt/prefect/flows
    - ./processing:/opt/processing
    - ./ingestion:/opt/ingestion
  networks:
    - bigdata_net

# ── Spark image reusable ──────────────────────────────────────
x-spark-common: &spark-common
  image: apache/spark:3.5.1
  user: root
  environment: &spark-common-env
    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
  networks:
    - bigdata_net

services:

  # ─────────────────────────────────────────
  # ZOOKEEPER
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # KAFKA BROKER
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────
  # KAFKA TOPIC INIT (sekali jalan)
  # ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic btc_ticker_raw --partitions 3 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic btc_ticker_dlq --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic volatility_pred --partitions 1 --replication-factor 1
        echo 'Topics created successfully.'
    networks:
      - bigdata_net

  # ─────────────────────────────────────────
  # POSTGRESQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./security/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./security/postgres/create_multiple_db.sh:/docker-entrypoint-initdb.d/00_create_dbs.sh
    ports:
      - "5434:5432"
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} && psql -U ${POSTGRES_USER} -d prefectdb -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15

  # ─────────────────────────────────────────
  # MINIO (Data Lake)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # MINIO BUCKET INIT (sekali jalan)
  # ─────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/twitter-raw &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/checkpoints &&
      mc mb --ignore-existing local/hive-warehouse &&
      echo 'Buckets initialized.'
      "
    networks:
      - bigdata_net

  # ─────────────────────────────────────────
  # SPARK MASTER
  # ─────────────────────────────────────────
  spark-master:
    <<: *spark-common
    container_name: spark-master
    environment:
      <<: *spark-common-env
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8081:8080"   # Spark Master Web UI
      - "7077:7077"
    volumes:
      - ./processing:/opt/spark/jobs
      - ./ml:/opt/spark/ml
      - spark_logs:/opt/spark/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    environment:
      <<: *spark-common-env
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./processing:/opt/spark/jobs
      - ./ml:/opt/spark/ml
      - spark_worker_logs:/opt/spark/logs

  # ─────────────────────────────────────────
  # HIVE METASTORE
  # Menyimpan skema tabel Parquet di MinIO
  # ─────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    image: btc-volatility-hive-metastore:latest
    container_name: hive-metastore
    environment:
      METASTORE_DB_HOSTNAME: postgres
      METASTORE_DB_PORT: 5432
      METASTORE_DB_NAME: ${HIVE_METASTORE_DB_NAME:-metastoredb}
      METASTORE_DB_USER: ${POSTGRES_USER}
      METASTORE_DB_PASS: ${POSTGRES_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/9083' 2>/dev/null && echo OK || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ─────────────────────────────────────────
  # MLFLOW
  # Tracking server + Model Registry
  # ─────────────────────────────────────────
  mlflow:
    build:
      context: ./docker/mlflow
      dockerfile: Dockerfile
    container_name: mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_MLFLOW}
      --artifacts-destination s3://${MLFLOW_ARTIFACT_BUCKET:-mlflow-artifacts}
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # TRINO
  # Query engine: PostgreSQL + MinIO (Hive)
  # ─────────────────────────────────────────
  trino:
    image: trinodb/trino:438
    container_name: trino
    ports:
      - "8082:8080"   # Trino Web UI + REST API
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog/postgresql.properties:/etc/trino/catalog/postgresql.properties:ro
      - ./trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      hive-metastore:
        condition: service_started
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  # ─────────────────────────────────────────
  # GRAFANA
  # Dashboard monitoring + Telegram alerting
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-k4ipbd_grafana_2026}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Provisioning otomatis datasource & dashboard
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Disable telemetry
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Telegram untuk alerting
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────
  # PREFECT SERVER (API + UI)
  # ─────────────────────────────────────────
  prefect-server:
    build:
      context: ./prefect
      dockerfile: Dockerfile
    container_name: prefect-server
    command: >
      prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefectdb
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4200/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # PREFECT INIT (work-pool + deployments)
  # ─────────────────────────────────────────
  prefect-init:
    <<: *prefect-common
    container_name: prefect-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "=== Prefect Init ==="
        while ! curl -sf http://prefect-server:4200/api/health; do
          echo "Menunggu prefect-server..."
          sleep 3
        done
        prefect work-pool create --type process default 2>/dev/null || true
        echo "Work pool 'default' ready."
        python /opt/prefect/flows/deploy_all.py
        echo "Deployments registered."
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *prefect-common-env

  # ─────────────────────────────────────────
  # PREFECT WORKER
  # ─────────────────────────────────────────
  prefect-worker:
    <<: *prefect-common
    container_name: prefect-worker
    command: prefect worker start --pool default
    depends_on:
      prefect-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────
  # PGBOUNCER (connection pooler)
  # ─────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB_APP}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata_net
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # BINANCE PRODUCER (stream ke Kafka)
  # ─────────────────────────────────────────
  binance-producer:
    build:
      context: ./ingestion
      dockerfile: Dockerfile.producer
    container_name: binance-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: btc_ticker_raw
      KAFKA_DLQ_TOPIC: btc_ticker_dlq
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    command: ["python", "binance_producer.py"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bigdata_net
  
  # ─────────────────────────────────────────
  # SPARK STREAMING JOB
  # ─────────────────────────────────────────
  spark-streaming-job:
    image: apache/spark:3.5.1
    container_name: spark-streaming-job
    user: root
    environment:
      # Koneksi
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: btc_ticker_raw
      KAFKA_DLQ_TOPIC: btc_ticker_dlq
      SPARK_MASTER_URL: spark://spark-master:7077
      # PostgreSQL via PgBouncer
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: "6432"
      APP_DB_NAME: ${POSTGRES_DB_APP}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # PostgreSQL direct (circuit breaker fallback)
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      # MLflow
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./processing:/opt/spark/jobs
    entrypoint: ["/bin/bash", "/opt/spark/jobs/entrypoint.sh"]
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    restart: on-failure
    networks:
      - bigdata_net

  # ─────────────────────────────────────────
  # STREAMLIT DASHBOARD
  # UI interaktif dengan Trino federated query
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    expose:
      - "8501"
    environment:
      # PostgreSQL (data real-time)
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${POSTGRES_DB_APP}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      # Trino (federated query)
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: kelompok4_ipbd
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    networks:
      - bigdata_net

  # ─────────────────────────────────────────
  # NGINX REVERSE PROXY
  # HTTPS + Basic Auth untuk Streamlit
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./security/nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_AUTH_USER: ${NGINX_AUTH_USER:-kelompok4_ipbd}
      NGINX_AUTH_PASSWORD: ${NGINX_AUTH_PASSWORD:-k4ipbd_nginx_2026}
    volumes:
      - ./security/nginx/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./security/nginx/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - dashboard
    networks:
      - bigdata_net

# ─────────────────────────────────────────
# NETWORKS & VOLUMES
# ─────────────────────────────────────────
networks:
  bigdata_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  spark_logs:
  spark_worker_logs:
  grafana_data: