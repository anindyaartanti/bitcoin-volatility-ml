# =============================================================
# trino/catalog/hive.properties
# Connector: Trino → MinIO via Hive Metastore
# Digunakan untuk query file Parquet (twitter-raw, dll.)
# =============================================================

connector.name=hive

# Hive Metastore Thrift URI (nama service dalam bigdata_net)
hive.metastore.uri=thrift://hive-metastore:9083

# MinIO / S3-compatible object storage
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin123
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
hive.s3.region=us-east-1

# Izinkan CREATE/DROP external table dari Trino
hive.non-managed-table-writes-enabled=true
hive.allow-drop-table=true

# Format file default untuk tabel baru
hive.storage-format=PARQUET

# Partitioned table support
hive.max-partitions-per-scan=1000000

# Timezone
hive.parquet.time-zone=UTC