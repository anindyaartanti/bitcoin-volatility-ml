[databases]
btcdb = host=postgres port=5432 dbname=btcdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
server_reset_query =
max_client_conn = 100
default_pool_size = 20

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Keepalive untuk deteksi koneksi mati
server_idle_timeout = 600
client_idle_timeout = 0
