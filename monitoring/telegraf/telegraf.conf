# ============================================================
# monitoring/telegraf/telegraf.conf
# Scrape Docker container stats + host metrics → PostgreSQL
# Tables auto-created: cpu, mem, disk, diskio, docker, 
#   docker_container_cpu, docker_container_mem, docker_container_net
# ============================================================

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "15s"
  collection_jitter = "2s"
  quiet = false
  logtarget = "stderr"

# ── Docker container metrics ─────────────────────────────────
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  timeout = "10s"
  perdevice = false
  total = false

# ── Host CPU ─────────────────────────────────────────────────
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false

# ── Host Memory ──────────────────────────────────────────────
[[inputs.mem]]

# ── Host Disk ────────────────────────────────────────────────
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "aufs", "squashfs"]

# ── PostgreSQL Output ────────────────────────────────────────
# Telegraf auto-creates tables with columns matching field + tag names
[[outputs.postgresql]]
  connection = "host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable"
  # Create tables if not exist with standard Telegraf schema
  # Column names: time, host, cpu, usage_idle, usage_system, used_percent, ...
