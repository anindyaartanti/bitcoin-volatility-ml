apiVersion: 1
groups:
  - name: BTC Pipeline
    folder: BTC Pipeline
    interval: 30s
    rules:
      - uid: no_new_predictions
        title: "No New Predictions"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT COUNT(*) AS cnt
                FROM volatility_pred
                WHERE window_start > NOW() - INTERVAL '15 minutes'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A == 0"
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Tidak ada prediksi baru dalam 15 menit"
          description: "Pipeline inference mungkin berhenti. Periksa spark-streaming-job."
        labels:
          severity: warning

      - uid: high_volatility
        title: "High Volatility Alert"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT AVG(predicted_vol_5m) AS avg_vol
                FROM volatility_pred
                WHERE window_start > NOW() - INTERVAL '1 hour'
              refId: A
            relativeTimeRange:
              from: 3600
              to: 0
        evaluations:
          - condition: "A > 0.1"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Volatilitas tinggi terdeteksi!"
          description: "Rata-rata prediksi volatilitas dalam 1 jam terakhir > 0.1. Ada potensi pergerakan harga besar."
        labels:
          severity: critical

      - uid: pipeline_stale
        title: "Pipeline Stale — Sentimen > 2 Jam"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT COUNT(*) AS cnt
                FROM sentiment_30m
                WHERE created_at > NOW() - INTERVAL '2 hours'
              refId: A
            relativeTimeRange:
              from: 7200
              to: 0
        evaluations:
          - condition: "A == 0"
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Sentimen pipeline stale > 2 jam"
          description: "Tidak ada data sentimen baru dalam 2 jam. Periksa prefect agent dan sentiment_flow."
        labels:
          severity: warning

      - uid: data_gap
        title: "Data Gap — OHLC > 5 Menit"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT COUNT(*) AS cnt
                FROM btc_ohlc_1m
                WHERE window_start > NOW() - INTERVAL '5 minutes'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A == 0"
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Data OHLC terputus > 5 menit"
          description: "Tidak ada data OHLC baru. Periksa binance-producer dan spark-streaming-job."
        labels:
          severity: critical

  - name: System Health
    folder: System Health
    interval: 30s
    rules:
      - uid: host_memory_high
        title: "[SYSTEM] Host Memory > 85%"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT used_percent
                FROM mem
                ORDER BY time DESC LIMIT 1
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A > 85"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "[SYSTEM] Host memory > 85%"
          description: "RAM hampir penuh. Risiko OOM. Periksa container yang boros memory."
        labels:
          severity: critical

      - uid: host_disk_high
        title: "[SYSTEM] Host Disk > 90%"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT MAX(used_percent) AS used_pct
                FROM disk
                WHERE time > NOW() - INTERVAL '5 minutes'
                  AND path NOT LIKE '/var/lib/docker/%'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A > 90"
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "[SYSTEM] Host disk > 90%"
          description: "Disk host hampir penuh. Bersihkan Docker volumes atau log files."
        labels:
          severity: critical

      - uid: host_cpu_high
        title: "[SYSTEM] Host CPU > 90% (sustained)"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT 100 - AVG(usage_idle) AS cpu_pct
                FROM cpu
                WHERE time > NOW() - INTERVAL '5 minutes'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A > 90"
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "[SYSTEM] Host CPU sustained > 90%"
          description: "CPU tinggi selama 5+ menit. Kemungkinan Spark job overload."
        labels:
          severity: warning

      - uid: container_telegraf_stale
        title: "[SYSTEM] Telegraf / Docker Engine Not Reporting"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT COUNT(*) AS cnt
                FROM docker_container_status
                WHERE time > NOW() - INTERVAL '2 minutes'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A == 0"
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: "[SYSTEM] Telegraf atau Docker Engine tidak merespons"
          description: "Tidak ada data container status dalam 2 menit. Cek Docker daemon dan container telegraf."
        labels:
          severity: critical

      - uid: container_failed
        title: "[SYSTEM] Container Exited (Non-Zero)"
        condition: A
        data:
          - refId: A
            datasourceUid: btcdb-postgres
            model:
              format: table
              rawSql: |
                SELECT COUNT(*) AS cnt
                FROM docker_container_status
                WHERE time > NOW() - INTERVAL '5 minutes'
                  AND container_status = 'exited'
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
        evaluations:
          - condition: "A > 0"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "[SYSTEM] Ada container yang exited"
          description: "{{ $values.A.Value }} container dalam status exited. Cek docker compose ps."
        labels:
          severity: warning
