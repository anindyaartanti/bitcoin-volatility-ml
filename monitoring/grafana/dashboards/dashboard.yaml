# =============================================================
# monitoring/grafana/provisioning/dashboards/dashboards.yaml
# Auto-load dashboard JSON dari folder /var/lib/grafana/dashboards
# =============================================================

apiVersion: 1

providers:
  - name: "Bitcoin Volatility ML"
    orgId: 1
    folder: "BTC Pipeline"
    folderUid: btc-pipeline
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false